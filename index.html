<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea House</title>
    <!-- tailwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- cdn link  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="font-[Manrope]">
    <main class="max-w-7xl m-auto">
      <section class="grid grid-cols-2 mt-14">
        <!-- right side div -->
        <div class="banner-left space-y-7">
          <h1 class="text-[5rem] font-extrabold">
            It's good <br />
            tea time at The Tea House
          </h1>
          <p class="text-[18px] text-gray-500">
            Tea and Botanical Solutions Supplier Give Optimum <br />
            Satisfaction To Your Taste Buds.
          </p>
          <button
            class="text-xl py-4 px-5 bg-linear-to-r from-[#FF8938] to-[#FF0000] text-white rounded-[10px]"
          >
            Explore More <i class="fa-solid fa-arrow-right-long -rotate-45"></i>
          </button>
        </div>
        <div
          class="banner-right flex justify-end items-end relative"
        >
          <img src="images/banner.png" alt="banner-img" />
          <div
            class="flex items-center gap-3 bg-white drop-shadow-xl rounded-xl py-4 px-6 absolute bottom-2.5 left-16"
          >
            <img src="images/star.png" alt="star-emoji" />
            <div>
              <h6 class="text-3xl font-extrabold text-black">5.00</h6>
              <p class="text-[1.25rem] text-gray-400">Trust Pilot Ratings</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
